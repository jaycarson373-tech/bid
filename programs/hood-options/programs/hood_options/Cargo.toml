[package]
name = "hood-options"
version = "0.1.0"
description = "Fully collateralized European capped options on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hood_options"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = "=1.1.2"
