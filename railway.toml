[build]
builder = "RAILPACK"
buildCommand = "npm --prefix services/fee-worker ci && npm --prefix services/fee-worker run build"
watchPatterns = ["services/fee-worker/**", "railway.toml"]

[deploy]
preDeployCommand = ["npm --prefix services/fee-worker run db:migrate"]
startCommand = "npm --prefix services/fee-worker run claim"
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
